<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Telangana Smart Market Intelligence</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 font-sans min-h-screen">

<!-- Header -->
<nav class="bg-green-800 text-white p-4 shadow">
<div class="container mx-auto flex items-center justify-between">
<h1 class="text-xl font-bold">🌾 Telangana Smart Mandi Dashboard</h1>
<button id="logoutBtn" class="hidden bg-green-700 px-4 py-2 rounded hover:bg-green-900">Logout</button>
</div>
</nav>

<section id="loginSection" class="container mx-auto p-6">
<div class="max-w-md mx-auto bg-white p-8 rounded shadow mt-12">
<h2 class="text-2xl font-bold text-green-800 mb-2">Welcome Back</h2>
<p class="text-gray-600 mb-6">Sign in to continue to the dashboard</p>
<form id="loginForm" class="space-y-4">
<div>
<label for="username" class="block font-semibold mb-2">Username</label>
<input id="username" type="text" class="p-2 border rounded w-full" placeholder="Enter username" required>
</div>
<div>
<label for="password" class="block font-semibold mb-2">Password</label>
<input id="password" type="password" class="p-2 border rounded w-full" placeholder="Enter password" required>
</div>
<p id="loginError" class="text-sm text-red-600 hidden">Please enter both username and password.</p>
<button type="submit" class="bg-green-700 text-white px-6 py-2 rounded w-full hover:bg-green-800">Login</button>
</form>
</div>
</section>

<main id="dashboardSection" class="container mx-auto p-6 hidden">

<!-- Filters -->
<div class="bg-white p-6 rounded shadow mb-6">
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">

<div>
<label class="block font-semibold mb-2">Select Crop</label>
<select id="cropSelect" class="p-2 border rounded w-full"></select>
</div>

<div>
<label class="block font-semibold mb-2">Select Market</label>
<select id="marketSelect" class="p-2 border rounded w-full">
<option value="">Select Market</option>
</select>
</div>

<div class="flex items-end">
<button id="analyzeBtn" class="bg-green-700 text-white px-6 py-2 rounded w-full hover:bg-green-800">
Analyze
</button>
</div>

</div>
</div>

<!-- Info Cards -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">

<div class="bg-white p-6 rounded shadow">
<h3 class="text-gray-500 text-sm">Latest Price</h3>
<p id="latestPrice" class="text-2xl font-bold">--</p>
</div>

<div class="bg-white p-6 rounded shadow">
<h3 class="text-gray-500 text-sm">Trend</h3>
<p id="trendText" class="text-2xl font-bold">--</p>
</div>

<div class="bg-white p-6 rounded shadow">
<h3 class="text-gray-500 text-sm">Advisory</h3>
<p id="advisory" class="text-lg font-bold text-blue-600">--</p>
</div>

</div>

<!-- Chart -->
<div class="bg-white p-6 rounded shadow mb-6">
<canvas id="priceChart"></canvas>
</div>

<!-- Table -->
<div class="bg-white p-6 rounded shadow">
<table class="w-full text-left">
<thead>
<tr class="border-b">
<th class="py-2">Market</th>
<th class="py-2">Date</th>
<th class="py-2">Price (₹)</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</main>

<script>

let dataStore = {};
let chartInstance = null;
let isInitialized = false;

const cropColors = {
    Mirchi: "#dc2626",
    Tomato: "#ea580c",
    Wheat: "#15803d",
    Rice: "#2563eb"
};

// Load JSON data
async function initialize() {
    if (isInitialized) return;
    const response = await fetch("data.json");
    dataStore = await response.json();
    populateCropDropdown();
    isInitialized = true;
}

// Populate Crop Dropdown
function populateCropDropdown() {
    const cropSelect = document.getElementById("cropSelect");
    cropSelect.innerHTML = "";

    Object.keys(dataStore).forEach(crop => {
        const option = document.createElement("option");
        option.value = crop;
        option.textContent = crop;
        cropSelect.appendChild(option);
    });

    populateMarketDropdown();
}

// Populate Market Dropdown
function populateMarketDropdown() {
    const selectedCrop = document.getElementById("cropSelect").value;
    const marketSelect = document.getElementById("marketSelect");

    const uniqueMarkets = [...new Set(dataStore[selectedCrop].map(item => item.market))];

    marketSelect.innerHTML = `<option value="">Select Market</option>`;

    uniqueMarkets.forEach(market => {
        const option = document.createElement("option");
        option.value = market;
        option.textContent = market;
        marketSelect.appendChild(option);
    });

    resetDashboard();
}

// Reset Dashboard UI
function resetDashboard() {
    document.getElementById("latestPrice").innerText = "--";
    document.getElementById("trendText").innerText = "--";
    document.getElementById("advisory").innerText = "--";
    document.getElementById("tableBody").innerHTML = "";

    if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
    }
}

// Analyze Button Click
function analyzeData() {

    const selectedCrop = document.getElementById("cropSelect").value;
    const selectedMarket = document.getElementById("marketSelect").value;

    if (!selectedMarket) {
        alert("Please select a market before analyzing.");
        return;
    }

    function showDashboard() {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("dashboardSection").classList.remove("hidden");
        document.getElementById("logoutBtn").classList.remove("hidden");
    }

    function showLogin() {
        document.getElementById("dashboardSection").classList.add("hidden");
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("logoutBtn").classList.add("hidden");
    }

    async function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const loginError = document.getElementById("loginError");

        if (!username || !password) {
            loginError.classList.remove("hidden");
            return;
        }

        loginError.classList.add("hidden");
        showDashboard();
        await initialize();
    }

    function handleLogout() {
        document.getElementById("loginForm").reset();
        document.getElementById("loginError").classList.add("hidden");
        resetDashboard();
        showLogin();
    }

    const filteredRecords = dataStore[selectedCrop]
        .filter(item => item.market === selectedMarket);

    if (filteredRecords.length < 2) return;

    updateTable(filteredRecords);
    updateSummary(filteredRecords);
    updateChart(filteredRecords, selectedCrop);
}

// Update Table
function updateTable(records) {
    const tableBody = document.getElementById("tableBody");

    tableBody.innerHTML = records.map(record => `
        <tr class="border-b">
            <td class="py-2">${record.market}</td>
            <td class="py-2">${record.arrival_date}</td>
            <td class="py-2">₹${record.modal_price}</td>
        </tr>
    `).join("");
}

// Update Trend & Advisory
function updateSummary(records) {

    const latest = records[records.length - 1].modal_price;
    const previous = records[records.length - 2].modal_price;

    document.getElementById("latestPrice").innerText = "₹ " + latest;

    const trendElement = document.getElementById("trendText");
    const advisoryElement = document.getElementById("advisory");

    if (latest > previous) {
        trendElement.innerText = "Increasing ▲";
        trendElement.className = "text-2xl font-bold text-green-600";
        advisoryElement.innerText = "Recommendation: Hold stock";
    }
    else if (latest < previous) {
        trendElement.innerText = "Decreasing ▼";
        trendElement.className = "text-2xl font-bold text-red-600";
        advisoryElement.innerText = "Recommendation: Consider selling";
    }
    else {
        trendElement.innerText = "Stable ●";
        trendElement.className = "text-2xl font-bold text-gray-600";
        advisoryElement.innerText = "Recommendation: Market stable";
    }
}

// Update Chart
function updateChart(records, crop) {

    if (chartInstance) chartInstance.destroy();

    const ctx = document.getElementById("priceChart");

    chartInstance = new Chart(ctx, {
        type: "line",
        data: {
            labels: records.map(r => r.arrival_date),
            datasets: [{
                label: crop + " Price",
                data: records.map(r => r.modal_price),
                borderColor: cropColors[crop],
                backgroundColor: cropColors[crop] + "33",
                borderWidth: 3,
                tension: 0,
                pointRadius: 6,
                fill: true
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: false }
            }
        }
    });
}

// Event Listeners
document.getElementById("cropSelect").addEventListener("change", populateMarketDropdown);
document.getElementById("analyzeBtn").addEventListener("click", analyzeData);
document.getElementById("loginForm").addEventListener("submit", handleLogin);
document.getElementById("logoutBtn").addEventListener("click", handleLogout);

showLogin();

</script>

</body>
</html>
