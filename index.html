<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Telangana Smart Mandi Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 font-sans min-h-screen">

<!-- Header -->
<nav class="bg-green-800 text-white p-4 shadow">
<div class="container mx-auto flex items-center justify-between">
<h1 class="text-xl font-bold">🌾 Telangana Smart Mandi Dashboard</h1>
<button id="logoutBtn" class="bg-green-700 px-4 py-2 rounded hover:bg-green-900">Logout</button>
</div>
</nav>

<main id="dashboardSection" class="container mx-auto p-6">

<!-- Filters -->
<div class="bg-white p-6 rounded shadow mb-6">
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">

<div>
<label class="block font-semibold mb-2">Select Crop</label>
<select id="cropSelect" class="p-2 border rounded w-full"></select>
</div>

<div>
<label class="block font-semibold mb-2">Select Market</label>
<select id="marketSelect" class="p-2 border rounded w-full">
<option value="">Select Market</option>
</select>
</div>

<div class="flex items-end">
<button id="analyzeBtn" class="bg-green-700 text-white px-6 py-2 rounded w-full hover:bg-green-800">
Analyze
</button>
</div>

</div>
</div>

<!-- Info Cards -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">

<div class="bg-white p-6 rounded shadow">
<h3 class="text-gray-500 text-sm">Latest Price</h3>
<p id="latestPrice" class="text-2xl font-bold">--</p>
</div>

<div class="bg-white p-6 rounded shadow">
<h3 class="text-gray-500 text-sm">Trend</h3>
<p id="trendText" class="text-2xl font-bold">--</p>
</div>

<div class="bg-white p-6 rounded shadow">
<h3 class="text-gray-500 text-sm">Advisory</h3>
<p id="advisory" class="text-lg font-bold text-blue-600">--</p>
</div>

</div>

<!-- Chart -->
<div class="bg-white p-6 rounded shadow mb-6">
<canvas id="priceChart"></canvas>
</div>

<!-- Market Map -->
<div class="bg-white p-6 rounded shadow mb-6">
<div class="flex items-center justify-between mb-3">
<h3 class="text-lg font-bold text-green-800">Selected Market Location</h3>
<p id="marketMapLabel" class="text-sm text-gray-500">Select a market to view map</p>
</div>
<div class="rounded overflow-hidden border">
<iframe
id="marketMapFrame"
title="Market Location Map"
class="w-full h-72"
src="https://maps.google.com/maps?q=Telangana%20Agriculture%20Market&t=&z=7&ie=UTF8&iwloc=&output=embed"
loading="lazy"
referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>
</div>

<!-- Table -->
<div class="bg-white p-6 rounded shadow">
<table class="w-full text-left">
<thead>
<tr class="border-b">
<th class="py-2">Market</th>
<th class="py-2">Date</th>
<th class="py-2">Price (₹)</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</main>

<script>

let dataStore = {};
let chartInstance = null;

const marketLocationOverrides = {
    Warangal: "Warangal Agriculture Market, Telangana, India",
    Khammam: "Khammam Agriculture Market, Telangana, India",
    Medak: "Medak Agriculture Market, Telangana, India",
    Karimnagar: "Karimnagar Agriculture Market, Telangana, India",
    Nizamabad: "Nizamabad Agriculture Market, Telangana, India",
    Siddipet: "Siddipet Agriculture Market, Telangana, India"
};

const cropColors = {
    Mirchi: "#dc2626",
    Tomato: "#ea580c",
    Wheat: "#15803d",
    Rice: "#2563eb"
};

// Load JSON data
async function initialize() {
    const response = await fetch("data.json");
    dataStore = await response.json();
    populateCropDropdown();
}

// Populate Crop Dropdown
function populateCropDropdown() {
    const cropSelect = document.getElementById("cropSelect");
    cropSelect.innerHTML = "";

    Object.keys(dataStore).forEach(crop => {
        const option = document.createElement("option");
        option.value = crop;
        option.textContent = crop;
        cropSelect.appendChild(option);
    });

    populateMarketDropdown();
}

// Populate Market Dropdown
function populateMarketDropdown() {
    const selectedCrop = document.getElementById("cropSelect").value;
    const marketSelect = document.getElementById("marketSelect");

    const uniqueMarkets = [...new Set(dataStore[selectedCrop].map(item => item.market))];

    marketSelect.innerHTML = `<option value="">Select Market</option>`;

    uniqueMarkets.forEach(market => {
        const option = document.createElement("option");
        option.value = market;
        option.textContent = market;
        marketSelect.appendChild(option);
    });

    resetDashboard();
}

// Reset Dashboard UI
function resetDashboard() {
    document.getElementById("latestPrice").innerText = "--";
    document.getElementById("trendText").innerText = "--";
    document.getElementById("advisory").innerText = "--";
    document.getElementById("tableBody").innerHTML = "";
    resetMarketMap();

    if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
    }
}

// Market Map helpers
function updateMarketMap(selectedMarket) {
    const mapLabel = document.getElementById("marketMapLabel");
    const mapFrame = document.getElementById("marketMapFrame");

    if (!selectedMarket) {
        resetMarketMap();
        return;
    }

    const locationQuery = marketLocationOverrides[selectedMarket] || `${selectedMarket} Agriculture Market, Telangana, India`;
    const encodedQuery = encodeURIComponent(locationQuery);
    mapFrame.src = `https://maps.google.com/maps?q=${encodedQuery}&t=&z=13&ie=UTF8&iwloc=&output=embed`;
    mapLabel.innerText = selectedMarket;
}

function resetMarketMap() {
    const mapLabel = document.getElementById("marketMapLabel");
    const mapFrame = document.getElementById("marketMapFrame");
    mapLabel.innerText = "Select a market to view map";
    mapFrame.src = "https://maps.google.com/maps?q=Telangana%20Agriculture%20Market&t=&z=7&ie=UTF8&iwloc=&output=embed";
}

// Analyze Button Click
function analyzeData() {

    const selectedCrop = document.getElementById("cropSelect").value;
    const selectedMarket = document.getElementById("marketSelect").value;

    if (!selectedMarket) {
        alert("Please select a market before analyzing.");
        return;
    }

    const filteredRecords = dataStore[selectedCrop]
        .filter(item => item.market === selectedMarket);

    if (filteredRecords.length < 2) return;

    updateTable(filteredRecords);
    updateSummary(filteredRecords);
    updateChart(filteredRecords, selectedCrop);
    updateMarketMap(selectedMarket);
}

function handleLogout() {
    window.location.href = "index.html";
}

// Update Table
function updateTable(records) {
    const tableBody = document.getElementById("tableBody");

    tableBody.innerHTML = records.map(record => `
        <tr class="border-b">
            <td class="py-2">${record.market}</td>
            <td class="py-2">${record.arrival_date}</td>
            <td class="py-2">₹${record.modal_price}</td>
        </tr>
    `).join("");
}

// Update Trend & Advisory
function updateSummary(records) {

    const latest = records[records.length - 1].modal_price;
    const previous = records[records.length - 2].modal_price;

    document.getElementById("latestPrice").innerText = "₹ " + latest;

    const trendElement = document.getElementById("trendText");
    const advisoryElement = document.getElementById("advisory");

    if (latest > previous) {
        trendElement.innerText = "Increasing ▲";
        trendElement.className = "text-2xl font-bold text-green-600";
        advisoryElement.innerText = "Recommendation: Hold stock";
    }
    else if (latest < previous) {
        trendElement.innerText = "Decreasing ▼";
        trendElement.className = "text-2xl font-bold text-red-600";
        advisoryElement.innerText = "Recommendation: Consider selling";
    }
    else {
        trendElement.innerText = "Stable ●";
        trendElement.className = "text-2xl font-bold text-gray-600";
        advisoryElement.innerText = "Recommendation: Market stable";
    }
}

// Update Chart
function updateChart(records, crop) {

    if (chartInstance) chartInstance.destroy();

    const ctx = document.getElementById("priceChart");

    chartInstance = new Chart(ctx, {
        type: "line",
        data: {
            labels: records.map(r => r.arrival_date),
            datasets: [{
                label: crop + " Price",
                data: records.map(r => r.modal_price),
                borderColor: cropColors[crop],
                backgroundColor: cropColors[crop] + "33",
                borderWidth: 3,
                tension: 0,
                pointRadius: 6,
                fill: true
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: false }
            }
        }
    });
}

// Event Listeners
document.getElementById("cropSelect").addEventListener("change", populateMarketDropdown);
document.getElementById("analyzeBtn").addEventListener("click", analyzeData);
document.getElementById("logoutBtn").addEventListener("click", handleLogout);

initialize();

</script>

</body>
</html>
