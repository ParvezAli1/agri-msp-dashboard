<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Telangana Smart Market Intelligence</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans min-h-screen">

<!-- Header -->
<nav class="bg-green-800 text-white p-4 shadow">
<div class="container mx-auto flex items-center justify-between">
<h1 class="text-xl font-bold">🌾 Telangana Smart Mandi Dashboard</h1>
</div>
</nav>

<section id="authSection" class="relative min-h-[calc(100vh-72px)] bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1800&q=80');">
<div class="absolute inset-0 bg-black/45"></div>
<div class="container mx-auto px-6 py-10 relative z-10">
<div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
<div class="text-white">
<h2 class="text-4xl font-bold mb-4">Smart Agriculture Tracking</h2>
<p class="text-lg text-green-100">Track mandi prices, trends, and farmer-focused recommendations in one secure dashboard.</p>
</div>
<div class="bg-white/95 backdrop-blur rounded-2xl shadow-2xl p-8">
<div class="flex bg-green-50 rounded-lg p-1 mb-6">
<button id="showLoginTab" class="auth-tab-btn w-1/2 py-2 rounded-md text-sm font-semibold bg-green-700 text-white">Login</button>
<button id="showSignupTab" class="auth-tab-btn w-1/2 py-2 rounded-md text-sm font-semibold text-green-800">Sign Up</button>
</div>

<form id="loginForm" class="auth-form space-y-4">
<div>
<label for="username" class="block font-semibold mb-2">Username</label>
<input id="username" type="text" class="p-2 border rounded w-full" placeholder="Enter username" required>
</div>
<div>
<label for="password" class="block font-semibold mb-2">Password</label>
<input id="password" type="password" class="p-2 border rounded w-full" placeholder="Enter password" required>
</div>
<p id="loginError" class="text-sm text-red-600 hidden">Please enter both username and password.</p>
<button type="submit" class="bg-green-700 text-white px-6 py-2 rounded w-full hover:bg-green-800">Login</button>
</form>

<form id="signupForm" class="auth-form space-y-4 hidden">
<div>
<label for="signupName" class="block font-semibold mb-2">Full Name</label>
<input id="signupName" type="text" class="p-2 border rounded w-full" placeholder="Enter full name" required>
</div>
<div>
<label for="signupUsername" class="block font-semibold mb-2">Username</label>
<input id="signupUsername" type="text" class="p-2 border rounded w-full" placeholder="Choose username" required>
</div>
<div>
<label for="signupPassword" class="block font-semibold mb-2">Password</label>
<input id="signupPassword" type="password" class="p-2 border rounded w-full" placeholder="Create password" required>
</div>
<p id="signupError" class="text-sm text-red-600 hidden">Please fill all signup details.</p>
<button type="submit" class="bg-green-700 text-white px-6 py-2 rounded w-full hover:bg-green-800">Create Account</button>
</form>
</div>
</div>
</div>
</section>

<script>
// NOTE: This is a client-side-only check for a static (GitHub Pages) site.
// It's a UX gate, not real security. Anyone can still open dashboard.html
// directly by URL. For real access control you'd need a backend / auth provider.

function setAuthTab(activeTab) {
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const loginTab = document.getElementById("showLoginTab");
    const signupTab = document.getElementById("showSignupTab");

    const isLogin = activeTab === "login";
    loginForm.classList.toggle("hidden", !isLogin);
    signupForm.classList.toggle("hidden", isLogin);

    loginTab.className = isLogin
        ? "auth-tab-btn w-1/2 py-2 rounded-md text-sm font-semibold bg-green-700 text-white"
        : "auth-tab-btn w-1/2 py-2 rounded-md text-sm font-semibold text-green-800";
    signupTab.className = !isLogin
        ? "auth-tab-btn w-1/2 py-2 rounded-md text-sm font-semibold bg-green-700 text-white"
        : "auth-tab-btn w-1/2 py-2 rounded-md text-sm font-semibold text-green-800";
}

function handleLogin(event) {
    event.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const loginError = document.getElementById("loginError");

    if (!username || !password) {
        loginError.classList.remove("hidden");
        return;
    }

    loginError.classList.add("hidden");
    sessionStorage.setItem("mandiDashboardAuth", "true");
    window.location.href = "dashboard.html";
}

function handleSignup(event) {
    event.preventDefault();
    const name = document.getElementById("signupName").value.trim();
    const username = document.getElementById("signupUsername").value.trim();
    const password = document.getElementById("signupPassword").value.trim();
    const signupError = document.getElementById("signupError");

    if (!name || !username || !password) {
        signupError.classList.remove("hidden");
        return;
    }

    signupError.classList.add("hidden");
    sessionStorage.setItem("mandiDashboardAuth", "true");
    window.location.href = "dashboard.html";
}

document.getElementById("loginForm").addEventListener("submit", handleLogin);
document.getElementById("signupForm").addEventListener("submit", handleSignup);
document.getElementById("showLoginTab").addEventListener("click", () => setAuthTab("login"));
document.getElementById("showSignupTab").addEventListener("click", () => setAuthTab("signup"));
</script>

</body>
</html>
